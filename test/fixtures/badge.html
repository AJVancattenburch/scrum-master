<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge fixture</title>
  <style>
    body {
      margin: 0;
      background: #fff
    }

    div {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      background: #c00
    }

    #badge {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 120px;
      height: 30px;
      background: #000
    }
  </style>
</head>

<body>
  <div></div>
  <span id="badge"></span>
</body>

</html>
